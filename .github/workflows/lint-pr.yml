name: lint-pr

# Diff-scoped lint gate for PRs. This intentionally avoids reviewdog/action-golangci-lint
# because its internal cache restore can fail on GitHub runners with tar "File exists"
# errors before any lint result is produced.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

permissions:
  contents: read
  checks: write

jobs:
  golangci-lint-diff:
    name: golangci-lint (diff-only, inline)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Go and system deps
        uses: ./.github/actions/setup-env
        with:
          bust_lumera_retag: 'true'

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint version

      - name: Run golangci-lint on changed Go packages
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t pkgs < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.go' \
            | xargs -r -n1 dirname \
            | sort -u \
            | sed 's#^#./#')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No changed Go packages; skipping golangci-lint"
            exit 0
          fi
          printf 'Linting changed Go packages:\n'
          printf '  %s\n' "${pkgs[@]}"
          golangci-lint run --config=.golangci.yml --timeout=15m --new-from-rev="$BASE_SHA" "${pkgs[@]}"
